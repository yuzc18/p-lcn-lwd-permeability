name: Synthetic pipeline checks
on:
  push:
  pull_request:
jobs:
  synthetic-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python train.py --epochs 2 --seeds 2025 2026 --bootstrap-resamples 100 --output-dir outputs/ci
